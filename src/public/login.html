<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Intranet Escolar - Inicio de sesión</title>

  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

  <main class="container">

    <h1>Intranet Escolar</h1>

    <form id="loginForm">

      <div>
        <label for="usuario">
          Usuario
        </label>

        <input
          type="text"
          id="usuario"
          name="usuario"
          autocomplete="username"
          required
        >
      </div>


      <div>
        <label for="contrasena">
          Contraseña
        </label>

        <input
          type="password"
          id="contrasena"
          name="contrasena"
          autocomplete="current-password"
          required
        >
      </div>


      <button type="submit">
        Iniciar sesión
      </button>


      <p
        id="mensaje"
        role="status"
        aria-live="polite">
      </p>

    </form>

  </main>


  <footer>
    <p>
      Intranet Escolar
    </p>
    <p>
      Sistema de gestión académica y comunicación escolar.
    </p>
  </footer>


  <script src="/js/login.js"></script>

</body>
</html>
